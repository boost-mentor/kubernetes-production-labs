# ДОКАЗАТЕЛЬСТВО ДЛЯ ДОСКИ 2.3 «ДВА ПОЛЯ, А НЕ ЧЕТЫРЕ».
# В курсах и статьях перечисляют ЧЕТЫРЕ вида affinity. В API их ДВА.
# Этот манифест применять НЕ НУЖНО «чтобы заработало» — он нужен, чтобы
# API-сервер сам сказал, что таких полей не знает.
#
# В КАДРЕ (все четыре команды проверены на Kubernetes v1.34.0):
#   kubectl explain pod.spec.affinity.nodeAffinity
#     → ровно 2 поля: required…IgnoredDuringExecution, preferred…IgnoredDuringExecution
#   kubectl apply -f affinity_fake_fields.yaml
#     → ДВЕ ошибки, по одной на поле:
#       Error from server (BadRequest): … strict decoding error: unknown field
#       "spec.affinity.nodeAffinity.requiredDuringSchedulingRequiredDuringExecution"
#       …и такая же про preferredDuringSchedulingPreferredDuringExecution
#   kubectl explain pod.spec.affinity
#     → видов ТРИ: nodeAffinity, podAffinity, podAntiAffinity (nodeAntiAffinity нет)
#   kubectl explain pod.spec.affinity.nodeAntiAffinity
#     → error: field "nodeAntiAffinity" does not exist
---
apiVersion: v1
kind: Pod
metadata:
  name: affinity-fake-required
spec:
  affinity:
    nodeAffinity:
      # ↓ ПОЛЯ С ТАКИМ ИМЕНЕМ В API НЕТ. Ожидаем отказ от сервера.
      requiredDuringSchedulingRequiredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: disktype
                operator: In
                values: ["ssd"]
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.9
---
apiVersion: v1
kind: Pod
metadata:
  name: affinity-fake-preferred
spec:
  affinity:
    nodeAffinity:
      # ↓ И ЭТОГО ПОЛЯ ТОЖЕ НЕТ.
      preferredDuringSchedulingPreferredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: disktype
                operator: In
                values: ["ssd"]
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.9
