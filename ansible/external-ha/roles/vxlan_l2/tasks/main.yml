---
- name: Установить инструменты L2 overlay
  ansible.builtin.apt:
    name: [iproute2, bridge-utils, curl]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Установить скрипт VXLAN
  ansible.builtin.template:
    src: setup-vxlan.sh.j2
    dest: /usr/local/sbin/setup-video2-vxlan
    mode: '0755'

- name: Построить общий L2 между lb1 и lb2
  ansible.builtin.command: /usr/local/sbin/setup-video2-vxlan
  changed_when: false

- name: Доказать доступность второго overlay-адреса
  ansible.builtin.command: "ping -c 2 -W 2 {{ hostvars[item].ha_overlay_ip }}"
  changed_when: false
  register: overlay_ping
  retries: 15
  delay: 2
  until: overlay_ping.rc == 0
  loop: "{{ groups['load_balancers'] }}"
  when: item != inventory_hostname
