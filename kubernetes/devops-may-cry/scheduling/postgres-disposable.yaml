# REC-only scheduling lab: a real PostgreSQL process with disposable storage.
# The point is taint+toleration+nodeAffinity. Production data belongs in a
# managed database or operator-backed StatefulSet with CSI storage and backups.
apiVersion: v1
kind: Service
metadata:
  name: devops-may-cry-postgres
  namespace: traffic-lab
spec:
  selector:
    app: devops-may-cry-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-may-cry-postgres
  namespace: traffic-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-may-cry-postgres
  template:
    metadata:
      labels:
        app: devops-may-cry-postgres
        app.kubernetes.io/name: devops-may-cry
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: dedicated
          operator: Equal
          value: database
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload.boostmentor.dev/tier
                    operator: In
                    values: [database]
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          envFrom:
            - secretRef:
                name: devops-may-cry-db
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/001_init.sql
              subPath: 001_init.sql
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: init
          configMap:
            name: devops-may-cry-db-init
