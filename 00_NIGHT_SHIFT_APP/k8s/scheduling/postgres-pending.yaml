# Deliberately incomplete variant for the first scheduling proof: it asks for
# the database node but lacks the matching toleration, so Events must explain
# why it remains Pending. The fixed variant is postgres-disposable.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: night-shift-postgres
  namespace: traffic-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: night-shift-postgres
  template:
    metadata:
      labels:
        app: night-shift-postgres
        app.kubernetes.io/name: night-shift
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload.boostmentor.dev/tier
                    operator: In
                    values: [database]
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          envFrom:
            - secretRef:
                name: night-shift-db
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
