apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: night-shift
  namespace: traffic-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: night-shift
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
