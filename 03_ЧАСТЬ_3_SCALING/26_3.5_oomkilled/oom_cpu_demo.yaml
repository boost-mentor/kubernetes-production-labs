# The same production-oriented DEVOPS MAY CRY binary demonstrates both outcomes.
# Memory above a cgroup limit is OOMKilled; CPU above a limit is throttled.
# Self-load endpoints are explicitly enabled only in this isolated lab.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-may-cry-oom
  namespace: traffic-lab
  labels:
    app: devops-may-cry-oom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-may-cry-oom
  template:
    metadata:
      labels:
        app: devops-may-cry-oom
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devops-may-cry
          # образ собран под историческим именем night-shift — это тот же сервис
          image: ghcr.io/boost-mentor/night-shift@sha256:1979cadfe28a68cfc34a9460bb757397307c27bcc8ea19bc02ede46c0ee9fd5c
          env:
            - name: LAB_ENDPOINTS_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-may-cry-throttled
  namespace: traffic-lab
  labels:
    app: devops-may-cry-throttled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-may-cry-throttled
  template:
    metadata:
      labels:
        app: devops-may-cry-throttled
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devops-may-cry
          # образ собран под историческим именем night-shift — это тот же сервис
          image: ghcr.io/boost-mentor/night-shift@sha256:1979cadfe28a68cfc34a9460bb757397307c27bcc8ea19bc02ede46c0ee9fd5c
          env:
            - name: LAB_ENDPOINTS_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
