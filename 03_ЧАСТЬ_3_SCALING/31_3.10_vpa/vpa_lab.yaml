# Recommender-only: сначала наблюдаем рекомендацию, не перезапускаем production pods.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: night-shift
  namespace: traffic-lab
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: night-shift
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: night-shift
        minAllowed:
          cpu: 25m
          memory: 32Mi
        maxAllowed:
          cpu: "1"
          memory: 512Mi
        controlledResources: [cpu, memory]
