# Three resource policies applied to the SAME DevOps May Cry binary. This keeps
# the experiment honest: QoS changes because of Kubernetes policy, not because
# we secretly switched applications.
#
# These variants are intentionally deployed only for the resource lab. The
# production baseline is kubernetes/devops-may-cry/base/deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-may-cry-guaranteed
  namespace: traffic-lab
  labels:
    app: devops-may-cry-guaranteed
    lab.boostmentor.dev/qos: guaranteed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-may-cry-guaranteed
  template:
    metadata:
      labels:
        app: devops-may-cry-guaranteed
        lab.boostmentor.dev/qos: guaranteed
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: devops-may-cry
          image: ghcr.io/boost-mentor/devops-may-cry@sha256:41439418d570649055117277a53b17b91fb40dad33dc3fa6b8a151fe68f86ca7
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-may-cry-burstable
  namespace: traffic-lab
  labels:
    app: devops-may-cry-burstable
    lab.boostmentor.dev/qos: burstable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-may-cry-burstable
  template:
    metadata:
      labels:
        app: devops-may-cry-burstable
        lab.boostmentor.dev/qos: burstable
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: devops-may-cry
          image: ghcr.io/boost-mentor/devops-may-cry@sha256:41439418d570649055117277a53b17b91fb40dad33dc3fa6b8a151fe68f86ca7
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-may-cry-besteffort
  namespace: traffic-lab
  labels:
    app: devops-may-cry-besteffort
    lab.boostmentor.dev/qos: best-effort
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-may-cry-besteffort
  template:
    metadata:
      labels:
        app: devops-may-cry-besteffort
        lab.boostmentor.dev/qos: best-effort
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: devops-may-cry
          image: ghcr.io/boost-mentor/devops-may-cry@sha256:41439418d570649055117277a53b17b91fb40dad33dc3fa6b8a151fe68f86ca7
          ports:
            - { name: http, containerPort: 8080 }
          # Deliberately no resources: this pod becomes BestEffort. Never use
          # this variant as the production baseline.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
