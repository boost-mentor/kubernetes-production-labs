apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-storage-hog
  namespace: traffic-lab
  labels:
    app.kubernetes.io/name: eviction-demo
    app.kubernetes.io/part-of: devops-may-cry
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: writer
      image: nicolaka/netshoot@sha256:7f08c4aff13ff61a35d30e30c5c1ea8396eac6ab4ce19fd02d5a4b3b5d0d09a2
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - dd if=/dev/zero of=/cache/fill bs=1M count=64; sleep 3600
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
          ephemeral-storage: 8Mi
        limits:
          cpu: 100m
          memory: 128Mi
          ephemeral-storage: 16Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: cache
          mountPath: /cache
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: cache
      emptyDir:
        sizeLimit: 16Mi
    - name: tmp
      emptyDir:
        sizeLimit: 8Mi
