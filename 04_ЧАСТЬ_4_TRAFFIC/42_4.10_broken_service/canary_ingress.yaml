# Canary через ingress-nginx: точное процентное деление трафика без операторов.
# Требует ingress-nginx в кластере (в kind: ingress-ready нода + официальный deploy manifest).
---
apiVersion: v1
kind: Service
metadata:
  name: app-stable-svc
spec:
  selector: {app: demo2, track: stable}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: app-canary-svc
spec:
  selector: {app: demo2, track: canary}
  ports: [{port: 80, targetPort: 8080}]
---
# Основной ingress — весь обычный трафик на stable
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-main
spec:
  ingressClassName: nginx
  rules:
    - host: app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: app-stable-svc, port: {number: 80}}
---
# Canary-ingress — ТОТ ЖЕ host, весовое деление
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
    # альтернативы весу:
    # nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"       # значение "always"→canary
    # nginx.ingress.kubernetes.io/canary-by-cookie: "canary_user"
spec:
  ingressClassName: nginx
  rules:
    - host: app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: app-canary-svc, port: {number: 80}}
