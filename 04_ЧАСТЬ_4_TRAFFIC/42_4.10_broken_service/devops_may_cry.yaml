# DEVOPS MAY CRY — clean recording bundle.
# Source code, tests, Dockerfile, Compose and split manifests live in
# ../../apps/devops-may-cry/. This file intentionally contains Kubernetes objects
# only; there is no application source embedded into args/ConfigMap.
#
# API contract used by the labs:
#   GET / and /quote              -> quote, who, pod
#   GET /order?on=night-outage    -> order, target, price_usd, status, handled_by
#   GET /overload?sec=60          -> controlled CPU load
#   GET /wound?mb=200             -> controlled memory pressure
#   GET /livez and /readyz        -> probes; GET /metrics -> Prometheus text
#
# Multi-arch image is pinned by immutable OCI index digest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-may-cry
  namespace: traffic-lab
  labels:
    app: devops-may-cry
    app.kubernetes.io/name: devops-may-cry
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: devops-may-cry
  template:
    metadata:
      labels:
        app: devops-may-cry
        app.kubernetes.io/name: devops-may-cry
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: devops-may-cry
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: devops-may-cry
      containers:
        - name: devops-may-cry
          # образ собран под историческим именем night-shift — это тот же сервис
          image: ghcr.io/boost-mentor/night-shift@sha256:1979cadfe28a68cfc34a9460bb757397307c27bcc8ea19bc02ede46c0ee9fd5c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 20
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: devops-may-cry
  namespace: traffic-lab
  labels:
    app: devops-may-cry
    app.kubernetes.io/name: devops-may-cry
spec:
  type: ClusterIP
  selector:
    app: devops-may-cry
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devops-may-cry
  namespace: traffic-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: devops-may-cry
