# СЕКРЕТЫ В ANSIBLE — как это делают по-взрослому (демо для кадра).
#
# ЧТО ПОКАЗЫВАЕМ:
#   cat vars/secrets.yml            → $ANSIBLE_VAULT;1.1;AES256 — нечитаемый шифротекст
#   git status                      → .vault_pass в .gitignore, в репозиторий не уедет
#   ansible-playbook -i inventory.ini secrets_demo.yml --ask-vault-pass
#       → пароль ПОДСТАВИЛСЯ в конфиг, но в выводе — звёздочки (no_log)
#   ansible-vault view vars/secrets.yml --ask-vault-pass   → расшифровать глазами
#   ansible-vault edit vars/secrets.yml --ask-vault-pass   → отредактировать не расшифровывая на диск
#
# В ПРОДЕ пароль приходит из masked CI secret/file, Vault или другого внешнего
# secret manager. Файл с vault-password рядом с репозиторием не храним.
- name: Секреты агентства
  hosts: night_office
  gather_facts: false
  vars_files:
    - vars/secrets.yml # ← зашифрованный файл, Ansible расшифрует на лету
  tasks:
    - name: Конфиг с секретом (значение подставилось, но в лог НЕ попало)
      ansible.builtin.copy:
        dest: /tmp/night_office/agency.conf
        mode: "0600" # права как у секрета
        content: |
          admin_password={{ ns_admin_password }}
          api_token={{ ns_api_token }}
      no_log: true # ⭐ без этого Ansible напечатал бы содержимое в вывод — и оно попало бы в запись экрана!

    - name: Проверяем, что файл создан (сам секрет не показываем)
      ansible.builtin.shell: "wc -c < /tmp/night_office/agency.conf"
      register: sz
      changed_when: false

    - name: Размер конфига
      ansible.builtin.debug:
        msg: "agency.conf: {{ sz.stdout | trim }} байт — содержимое в кадр не выводим"
