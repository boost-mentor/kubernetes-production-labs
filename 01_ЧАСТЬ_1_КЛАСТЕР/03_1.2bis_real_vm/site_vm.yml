# ХЕЛЛО-ANSIBLE НА ЖИВОЙ ВМ: настроить машину, созданную Terraform.
# «Terraform создал VM — Ansible установил runtime и запустил наш образ».
#
# ЗАПУСК (в кадре; IP — из terraform output vm_ip):
#   echo "[demo_vm]" > vm_inventory.ini
#   echo "<IP> ansible_user=<terraform output ssh_user>" >> vm_inventory.ini
#   ansible -i vm_inventory.ini all -m ping                 # pong с ЖИВОЙ машины
#   ansible-playbook -i vm_inventory.ini site_vm.yml        # runtime + systemd unit
#   open http://<IP>/                                       # реальная DEVOPS MAY CRY UI
#   ansible-playbook -i vm_inventory.ini site_vm.yml        # changed=0 — идемпотентность
- name: Настроить свежую ВМ
  hosts: demo_vm
  become: true
  vars:
    devops_may_cry_image: ghcr.io/boost-mentor/devops-may-cry@sha256:41439418d570649055117277a53b17b91fb40dad33dc3fa6b8a151fe68f86ca7
  tasks:
    - name: Имя машины — говорящее
      ansible.builtin.hostname:
        name: hello-ansible-vm

    - name: Docker runtime установлен
      ansible.builtin.apt:
        name:
          - docker.io
          - curl
        state: present
        update_cache: true

    - name: DEVOPS MAY CRY управляется systemd, а не ручным docker run
      ansible.builtin.copy:
        dest: /etc/systemd/system/devops-may-cry.service
        mode: "0644"
        content: |
          [Unit]
          Description=DEVOPS MAY CRY demo API
          Wants=network-online.target docker.service
          After=network-online.target docker.service

          [Service]
          Restart=always
          RestartSec=3
          ExecStartPre=-/usr/bin/docker rm -f devops-may-cry
          ExecStartPre=/usr/bin/docker pull {{ devops_may_cry_image }}
          ExecStart=/usr/bin/docker run --rm --name devops-may-cry --read-only --tmpfs /tmp:size=16m --cap-drop=ALL --security-opt=no-new-privileges:true -p 80:8080 {{ devops_may_cry_image }}
          ExecStop=/usr/bin/docker stop -t 25 devops-may-cry
          TimeoutStopSec=30

          [Install]
          WantedBy=multi-user.target
      notify:
        - Перечитать systemd
        - Перезапустить DEVOPS MAY CRY

    - name: Применить новый unit до проверки сервиса
      ansible.builtin.meta: flush_handlers

    - name: DEVOPS MAY CRY запущен и включён в автозагрузку
      ansible.builtin.systemd_service:
        name: devops-may-cry
        state: started
        enabled: true

    - name: Дождаться readiness реального приложения
      ansible.builtin.uri:
        url: http://127.0.0.1/readyz
        status_code: 200
      register: readiness
      retries: 20
      delay: 2
      until: readiness.status == 200
      changed_when: false

  handlers:
    - name: Перечитать systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Перезапустить DEVOPS MAY CRY
      ansible.builtin.systemd_service:
        name: devops-may-cry
        state: restarted
