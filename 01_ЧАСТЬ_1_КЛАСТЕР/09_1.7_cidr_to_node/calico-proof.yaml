apiVersion: v1
kind: Namespace
metadata:
  name: network-proof
---
apiVersion: v1
kind: Pod
metadata:
  name: calico-a
  namespace: network-proof
  labels: {app: calico-proof}
spec:
  nodeSelector: {kubernetes.io/hostname: node2}
  containers:
    - name: toolbox
      image: busybox:1.37.0
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: calico-b
  namespace: network-proof
  labels: {app: calico-proof}
spec:
  nodeSelector: {kubernetes.io/hostname: node3}
  containers:
    - name: toolbox
      image: busybox:1.37.0
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
  restartPolicy: Never
