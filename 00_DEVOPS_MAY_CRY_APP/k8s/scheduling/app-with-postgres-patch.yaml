apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-may-cry
  namespace: traffic-lab
spec:
  template:
    spec:
      containers:
        - name: devops-may-cry
          env:
            - name: DB_HOST
              value: devops-may-cry-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: devops-may-cry-db
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: devops-may-cry-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-may-cry-db
                  key: POSTGRES_PASSWORD
            - name: DB_SSLMODE
              value: disable
